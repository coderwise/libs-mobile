name: CI

# Tests on every pull request and on main. Publishing is separate (publish.yml, tag-driven).
on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  jvm:
    name: Desktop and Android host tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Skiko, which Compose draws with, links against these even with no display. Without them
      # the tests that draw for real (the desktop ones) cannot load it.
      - name: Install Skia's system libraries
        run: sudo apt-get update && sudo apt-get install -y libgl1 libx11-6 libegl1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # --continue: one module failing should not hide the rest.
      - name: Test
        run: ./gradlew desktopTest testAndroidHostTest --continue --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-test-reports
          path: '**/build/reports/tests/'

  apple-and-web:
    name: iOS, JS and wasm tests
    # macOS host: the Kotlin/Native iOS tests only run there, and it has the Chrome the browser
    # tests drive.
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test on the iOS simulator
        run: ./gradlew iosSimulatorArm64Test --continue --stacktrace

      # Only the map modules. The others do not declare an executable js and wasmJs binary, which
      # the Compose plugin requires before it will run UI tests there
      # (https://youtrack.jetbrains.com/issue/CMP-4906), so their browser tests cannot run until
      # they do. :map-engine is one of them.
      - name: Test in the browser
        run: >-
          ./gradlew --continue --stacktrace
          :map-core:jsBrowserTest :map-core:wasmJsBrowserTest
          :map-view:jsBrowserTest :map-view:wasmJsBrowserTest
          :map-view-cache:jsBrowserTest :map-view-cache:wasmJsBrowserTest
          :map-view-controls:jsBrowserTest :map-view-controls:wasmJsBrowserTest
          :map-view-core:jsBrowserTest :map-view-core:wasmJsBrowserTest
          :map-view-geojson:jsBrowserTest :map-view-geojson:wasmJsBrowserTest
          :map-view-tiles:jsBrowserTest :map-view-tiles:wasmJsBrowserTest
          :map-view-tiles-raster:jsBrowserTest :map-view-tiles-raster:wasmJsBrowserTest
          :map-view-tiles-vector:jsBrowserTest :map-view-tiles-vector:wasmJsBrowserTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apple-and-web-test-reports
          path: '**/build/reports/tests/'
